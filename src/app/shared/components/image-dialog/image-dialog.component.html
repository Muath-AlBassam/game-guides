<h1 mat-dialog-title>
  <span
    mat-icon-button
    [mat-dialog-close]="null"
    title="Close"
    class="close-btn"
  >
    &times;
  </span>
</h1>

<div mat-dialog-content (click)="closeOnOutsideClick($event)">
  <div class="dialog-image-container">
    <img
      [src]="data.imageUrl"
      [alt]="data.name || 'Image'"
      class="dialog-image"
    >
  </div>
</div>
