<div
  class="character-container"
  [class]="charmd.code"
  [style]="'border-radius: 5px; ' + styles"
  [style.width.px]="crop.containerWidth"
  [style.height.px]="crop.containerHeight">
  <img
    [src]="charmd.imagePFP ? charmd.imagePFP.imageUrl : UNKNOWN_IMG"
    [alt]="charmd.name"
    [title]="charmd.name"
    [attr.class]="'pfp' + classes"
    [ngClass]="{'char-img-resize': enableViewCharacter}"
    [style.width.px]="crop.imageWidth"
    [style.height.px]="crop.imageHeight"
    [style.left.px]="crop.imageLeft"
    [style.top.px]="crop.imageTop"
    (load)="onImageLoad($event)"
    (click)="goToCharacterDetails()"
    loading="lazy" />
  @if (showElement && charmd.element?.imageUrl) {
    <ng-container *ngTemplateOutlet="elementImageTemplate"></ng-container>
  }

  @if (showType && charmd.type?.imageUrl) {
    <ng-container *ngTemplateOutlet="typeImageTemplate"></ng-container>
  }
</div>
