@if (formattedNotes.length > 0) {
  <div class="g-notes-container">
    <ul class="game-notes">
      @for (note of formattedNotes; track $index) {
        <li>
          <span class="note-content" [innerHTML]="note">
          </span>
        </li>
      }
    </ul>
  </div>
} @else {
  <app-no-data></app-no-data>
}
