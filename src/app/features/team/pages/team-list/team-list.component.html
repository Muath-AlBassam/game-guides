<div class="row" id="team-category-list-header">
  <div class="col-md-12">
    <div class="content-header">
      Teams
      <span class="additional-text">
        Showing ({{ teams.length }}) Characters
      </span>
    </div>
  </div>
</div>

<app-advanced-filter
  [placeholder]="'Search teams and characters...'"
  [tagFilter]="true"
  (textChange)="onTextChange($event)"
  (tagChange)="onTagChange($event)">
</app-advanced-filter>

<div class="row mt-4">
  @for (team of teams; track $index) {
    <div class="col-xl-4 col-lg-4 col-md-4 col-sm-12 mb-3">
      <app-team-info [teamCode]="team.code" [showTags]="true"></app-team-info>
    </div>
  }
</div>
