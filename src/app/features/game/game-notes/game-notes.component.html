@if (notes.length > 0) {
  <div class="g-notes-container">
    <ul class="game-notes">
      @for (note of notes; track $index) {
        <li>
          @if (note.formattedTitle) {
            <span class="game-notes__title" [innerHTML]="note.formattedTitle"></span>:
            <br>
          }
          <span class="game-notes__content" [innerHTML]="note.formattedText"></span>
        </li>
      }
    </ul>
  </div>
} @else {
  <app-no-data></app-no-data>
}
