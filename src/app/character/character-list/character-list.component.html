<div class="row" id="team-characters-header">
  <div class="col-md-12">
    <div class="content-header">
      Characters
      <span class="additional-text">Showing ({{characters.length}}) Characters</span>
    </div>
  </div>
</div>

<app-advanced-filter
  [rarityFilter]="true"
  [elementFilter]="true"
  [typeFilter]="true"
  [resetButton]="true"
  [placeholder]="'Search characters...'"
  (textChange)="onTextChange($event)"
  (rarityChange)="onRarityChange($event)"
  (elementChange)="onElementChange($event)"
  (typeChange)="onTypeChange($event)"
  (reset)="onReset()">
</app-advanced-filter>

@if (characters && characters.length > 0) {
  <div class="characters-container" id="characters-container">
    @for (charmd of characters; track charmd.code) {
      <app-character-image
        [characterName]="charmd.name"
        [dimensions]="160"
        [withDetailsDialog]="true"
        [withElement]="true"
        [withType]="true"
        [imageStyle]="'card'">
      </app-character-image>
    }
  </div>
} @else {
  <app-no-data></app-no-data>
}
