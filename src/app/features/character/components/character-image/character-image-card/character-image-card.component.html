<div
  class="char-card"
  [class]="charmd.code"
  [ngClass]="{'glow-border': charmd.enhanced}"
  [style]="styles"
  [ngStyle]="{
    'width': dimensions + 'px',
    'height': dimensions * CARD_HEIGHT_ASPECT_RATIO + 'px'
  }">

  @if (showElement && charmd.element?.imageUrl) {
    <ng-container *ngTemplateOutlet="elementImageTemplate"></ng-container>
  }
  @if (showType && charmd.type?.imageUrl) {
    <ng-container *ngTemplateOutlet="typeImageTemplate"></ng-container>
  }

  <img
    class="char-img"
    [ngClass]="{'char-img-resize pointer': enableViewCharacter}"
    [src]="charmd.imageCard ? charmd.imageCard.imageUrl : UNKNOWN_IMG"
    [alt]="charmd.name"
    [title]="charmd.name"
    [style.width.px]="crop.imageWidth"
    [style.height.px]="crop.imageHeight"
    [style.left.px]="crop.imageLeft"
    [style.top.px]="crop.imageTop"
    (load)="onImageLoad($event)"
    (click)="goToCharacterDetails()"
    loading="lazy" />

  <span class="char-name">
    {{ charmd.name }}
  </span>
  <div class="smoky-overlay"></div>
</div>
